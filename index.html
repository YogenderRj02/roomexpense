<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khata — Room Expense Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A;
    --ink-soft:#3E4E6E;
    --paper:#F7F3E8;
    --paper-line:#E4DCC6;
    --paper-raised:#FFFDF7;
    --gold:#B8892B;
    --gold-light:#E4B85A;
    --debt:#B23A48;
    --credit:#2F6E4F;
    --border:#D8CFB4;
    --radius:14px;
    --shadow:0 4px 18px rgba(27,42,74,0.08);
    --shadow-lg:0 12px 32px rgba(27,42,74,0.14);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;
    background-image:repeating-linear-gradient(var(--paper) 0 31px, var(--paper-line) 31px 32px);
    background-attachment:local; min-height:100vh;}
  .wrap{max-width:960px;margin:0 auto;padding:20px 20px 90px;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;color:var(--ink);margin:0;}
  #page-host{animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .brand{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    margin:-20px -20px 22px;padding:16px 20px;flex-wrap:wrap;gap:12px;
    background:rgba(247,243,232,0.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--paper-line);}
  .brand-title{display:flex;align-items:baseline;gap:10px;}
  .brand-title h1{font-size:26px;letter-spacing:-0.01em;}
  .brand-title span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);border:1px solid var(--border);padding:2px 8px;border-radius:20px;}
  .who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-soft);}
  .who b{color:var(--ink);}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--gold);color:#fff;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:600;transition:transform .1s ease, opacity .15s ease, box-shadow .15s ease;}
  button:active{transform:scale(.96);}
  .btn-primary{background:var(--ink);color:var(--paper-raised);box-shadow:0 2px 8px rgba(27,42,74,0.25);}
  .btn-primary:hover{opacity:.92;box-shadow:0 4px 14px rgba(27,42,74,0.32);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--paper-raised);border-color:var(--ink-soft);}
  .btn-danger{background:transparent;color:var(--debt);border:1px solid var(--debt);}
  .btn-danger:hover{background:rgba(178,58,72,0.08);}
  .btn-small{padding:6px 12px;font-size:12px;}
  input,select{font-family:'Inter',sans-serif;font-size:14px;padding:11px 13px;border:1px solid var(--border);border-radius:9px;background:var(--paper-raised);color:var(--ink);width:100%;transition:border-color .15s ease, box-shadow .15s ease;}
  input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,137,43,0.18);}
  select{cursor:pointer;}
  label{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px;}
  .card{background:var(--paper-raised);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;transition:box-shadow .2s ease;}
  .center-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;}
  .auth-card{width:100%;max-width:380px;box-shadow:var(--shadow-lg);}
  .auth-tabs{display:flex;gap:6px;margin-bottom:18px;}
  .auth-tabs button{flex:1;background:transparent;color:var(--ink-soft);border:1px solid var(--border);}
  .auth-tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .field{margin-bottom:14px;}
  .err{color:var(--debt);font-size:13px;margin-top:8px;min-height:16px;}
  .msg{color:var(--credit);font-size:13px;margin-top:8px;}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--paper-line);border-top-color:var(--gold);animation:spin .7s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* Settle board */
  .settle-board{background:linear-gradient(135deg, var(--ink) 0%, #26375e 100%);border-radius:18px;padding:24px;color:var(--paper);margin-bottom:26px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);}
  .settle-board::before{content:"";position:absolute;top:-50px;right:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle, rgba(228,184,90,0.35), transparent 70%);}
  .settle-board::after{content:"";position:absolute;bottom:-60px;left:-30px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);}
  .settle-board h2{color:#fff;font-size:19px;margin-bottom:14px;position:relative;}
  .settle-list{display:flex;flex-direction:column;gap:8px;position:relative;}
  .settle-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);border-radius:10px;padding:12px 16px;font-size:14px;transition:background .15s ease;}
  .settle-row:hover{background:rgba(255,255,255,0.11);}
  .settle-row b{color:#fff;}
  .arrow{color:var(--gold-light);font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .amt{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--gold-light);font-size:15px;}
  .all-settled{opacity:.85;font-size:14px;padding:14px 0;position:relative;}
  .net-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px;position:relative;}
  .net-card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);border-radius:10px;padding:12px 14px;}
  .net-card .name{font-size:12px;color:var(--paper);opacity:.85;}
  .net-card .val{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:17px;margin-top:2px;}
  .val.pos{color:#7FD6A6;}
  .val.neg{color:#F0A0A8;}
  .val.zero{color:#cfcfcf;}
  /* Tabs / nav */
  .tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);}
  .tab{padding:10px 16px;font-size:14px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;cursor:pointer;background:none;border-radius:8px 8px 0 0;}
  .tab:hover{background:rgba(184,137,43,0.08);}
  .tab.active{color:var(--ink);border-bottom-color:var(--gold);background:rgba(184,137,43,0.08);}
  /* Expense list */
  .expense-item{display:flex;align-items:flex-start;gap:14px;padding:16px 8px;border-bottom:1px solid var(--paper-line);border-radius:8px;transition:background .15s ease, transform .1s ease;}
  .date-heading{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);padding:14px 8px 8px;}
  .date-heading:first-child{padding-top:2px;}
  .expense-item:hover{background:rgba(184,137,43,0.06);transform:translateX(2px);}
  .expense-item:last-child{border-bottom:none;}
  .expense-icon{width:38px;height:38px;border-radius:10px;background:var(--paper);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .expense-desc{flex:1;}
  .expense-desc .title{font-weight:600;font-size:15px;}
  .expense-desc .meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .expense-amt{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;color:var(--ink);white-space:nowrap;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
  .chip{font-size:11px;background:var(--paper);border:1px solid var(--border);padding:3px 10px;border-radius:20px;color:var(--ink-soft);font-weight:500;}
  /* Checkbox split list */
  .split-list{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:6px;background:var(--paper-raised);}
  .split-row{display:flex;align-items:center;gap:10px;font-size:14px;padding:8px 10px;border-radius:7px;transition:background .12s ease;cursor:pointer;}
  .split-row:hover{background:var(--paper);}
  .split-row input{width:auto;accent-color:var(--gold);}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:140px;}
  /* Members */
  .member-row{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--paper-line);border-radius:8px;transition:background .15s ease;}
  .member-row:hover{background:rgba(184,137,43,0.05);}
  .member-row:last-child{border-bottom:none;}
  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg, var(--ink), #2c4374);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;flex-shrink:0;}
  .member-info{flex:1;min-width:0;}
  .member-info .name{font-weight:600;font-size:14px;}
  .member-info .email{font-size:12px;color:var(--ink-soft);}
  .badge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .badge.admin{background:var(--gold);color:#fff;}
  .badge.member{background:var(--paper);border:1px solid var(--border);color:var(--ink-soft);}
  .badge.invited{background:#EEE6C8;color:#8A6D1D;}
  .badge.pending{background:#F0DCDC;color:var(--debt);}
  .member-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;}
  .empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:44px 10px;}
  .empty .emoji{font-size:34px;display:block;margin-bottom:10px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
    display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;
    font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:50;transition:transform .25s ease, opacity .25s ease;
    max-width:calc(100vw - 32px);text-align:left;}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  .toast-success{background:var(--credit);}
  .toast-error{background:var(--debt);}
  .toast-icon{font-size:14px;}
  .setup-note{max-width:520px;margin:60px auto;padding:24px;background:var(--paper-raised);border:1px solid var(--border);border-radius:12px;font-size:14px;line-height:1.6;}
  .setup-note code{background:var(--paper);padding:1px 5px;border-radius:4px;font-family:'IBM Plex Mono',monospace;}
  .divider-text{font-size:12px;color:var(--ink-soft);text-align:center;margin:14px 0;}
  @media (max-width:640px){
    .wrap{padding:14px 14px 90px;}
    .brand{margin:-14px -14px 18px;padding:12px 14px;flex-direction:column;align-items:flex-start;gap:8px;}
    .brand-title h1{font-size:20px;}
    .who{width:100%;justify-content:space-between;font-size:12px;flex-wrap:wrap;row-gap:8px;}
    .card{padding:16px;}
    h3{font-size:17px;}
    /* prevent iOS auto-zoom on input focus (needs >=16px) */
    input,select{font-size:16px;padding:10px 12px;}
    button{padding:10px 14px;}
    .btn-small{padding:6px 10px;font-size:12px;}
    /* settle board */
    .settle-board{padding:18px;}
    .settle-board h2{font-size:17px;}
    .settle-row{flex-wrap:wrap;padding:10px 12px;}
    .amt{margin-left:0;width:100%;text-align:right;}
    .net-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
    .net-card{padding:10px 12px;}
    /* tabs scroll horizontally instead of wrapping/overflowing */
    .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{padding:9px 13px;font-size:13px;white-space:nowrap;flex-shrink:0;}
    /* form rows stack on mobile instead of squeezing side by side */
    .row{flex-direction:column;gap:0;}
    .row > *{min-width:100%;}
    /* expense list */
    .expense-item{padding:14px 4px;gap:10px;}
    .expense-icon{width:34px;height:34px;font-size:15px;}
    .expense-desc .title{font-size:14px;}
    .expense-desc .meta{font-size:11.5px;}
    .expense-amt{font-size:14px;}
    /* members */
    .member-row{flex-wrap:wrap;padding:12px 4px;}
    .member-actions{width:100%;padding-left:48px;margin-top:2px;}
    /* expense detail grid tightens automatically via inline auto-fit, just reduce gaps */
    .setup-note{margin:32px auto;padding:18px;}
    #memberChartWrap{grid-template-columns:1fr !important;}
  }
  @media (max-width:380px){
    .brand-title span{display:none;}
    .net-grid{grid-template-columns:repeat(2,1fr);}
    .member-actions{padding-left:0;}
  }
</style>
</head>
<body>

<div id="setupScreen" style="display:none">
  <div class="setup-note">
    <h2 style="margin-bottom:10px;">Firebase config chahiye</h2>
    <p>Ye app chalane ke liye apna Firebase project banayein aur neeche batayi gayi <code>firebaseConfig</code> is file ke <code>&lt;script type="module"&gt;</code> section ke shuru mein paste karein. Poori setup instructions is file ke sabse neeche comment mein di gayi hain.</p>
  </div>
</div>

<div id="app" class="wrap" style="display:none"></div>
<div id="toastHost"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="module">
/* ============================================================
   1) APNA FIREBASE CONFIG YAHAN PASTE KAREIN
   (Firebase Console > Project Settings > General > Your apps > Web app)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDFRrb4VZGB6wFG2uCnqq8uwdWBriQEW1o",
  authDomain: "room-58166.firebaseapp.com",
  databaseURL: "https://room-58166-default-rtdb.firebaseio.com",
  projectId: "room-58166",
  storageBucket: "room-58166.firebasestorage.app",
  messagingSenderId: "11760563800",
  appId: "1:11760563800:web:b2d8f9625a44898b09bc2d",
  measurementId: "G-6VN1MGVWCD"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, updateProfile, sendPasswordResetEmail,
  updatePassword, reauthenticateWithCredential, EmailAuthProvider
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, addDoc,
  getDocs, getDoc, query, where, onSnapshot, serverTimestamp, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

if (!firebaseConfig.apiKey || firebaseConfig.apiKey === "YOUR_API_KEY") {
  document.getElementById('setupScreen').style.display = 'block';
} else {
  document.getElementById('app').style.display = 'block';
  runApp();
}

function runApp(){
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const membersCol = collection(db, "members");
const expensesCol = collection(db, "expenses");
const invitesCol = collection(db, "invites"); // doc id = email
const settlementsCol = collection(db, "settlements");
const paymentsCol = collection(db, "payments");
const rentCol = collection(db, "rentPayments"); // rent paid to the landlord

let currentUser = null;   // firebase auth user
let myMember = null;      // my member doc {id,...}
let allMembers = [];      // active + pending (invites live separately now)
let allExpenses = [];
let allInvites = [];      // pending invites {id(=email), name, email, createdAt}
let allSettlements = [];  // past settlements, newest first
let allRent = [];         // rent payments made to the landlord, newest first
let allPayments = [];     // individual cash payments members have handed over, newest first
let unsubMembers = null, unsubExpenses = null, unsubInvites = null, unsubSettlements = null, unsubPayments = null, unsubRent = null;
let activeCharts = []; // Chart.js instances currently on screen, destroyed before each re-render

const DESCRIPTION_SUGGESTIONS = ['Grocery','Rent','Electricity Bill','Water Bill','Gas','Internet / WiFi','Maintenance','Cleaning','Food / Eating Out','Vegetables','Milk','Other'];
const EDIT_WINDOW_MS = 10 * 60 * 1000; // 10 minutes

function parseRoute(){
  const hash = location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  if (parts.length === 0) return {page:'dashboard'};
  if (parts[0] === 'add') return {page:'add'};
  if (parts[0] === 'reports') return {page:'reports'};
  if (parts[0] === 'charts') return {page:'charts'};
  if (parts[0] === 'settle') return {page:'settle'};
  if (parts[0] === 'account') return {page:'account'};
  if (parts[0] === 'rent') return {page:'rent'};
  if (parts[0] === 'members') return {page:'members'};
  if (parts[0] === 'expense' && parts[1]) return {page: parts[2]==='edit' ? 'editExpense' : 'expenseDetail', id: parts[1]};
  return {page:'dashboard'};
}
function goTo(hash){ location.hash = hash; }
window.addEventListener('hashchange', ()=> render());

const appEl = document.getElementById('app');

function toast(text, type='info'){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  const icon = type==='error' ? '⚠️' : type==='success' ? '✓' : 'ℹ️';
  el.innerHTML = `<span class="toast-icon">${icon}</span><span>${escapeHtml(text)}</span>`;
  host.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=> { el.classList.remove('show'); setTimeout(()=>el.remove(), 250); }, 3200);
}

function money(n){
  const v = Math.round((n + Number.EPSILON) * 100) / 100;
  return '₹' + Math.abs(v).toLocaleString('en-IN', {maximumFractionDigits:2});
}

function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()).join('');
}

/* ---------------- AUTH STATE ---------------- */
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (unsubMembers) unsubMembers();
  if (unsubExpenses) { unsubExpenses(); unsubExpenses = null; }
  if (unsubInvites) unsubInvites();
  if (unsubSettlements) { unsubSettlements(); unsubSettlements = null; }
  if (unsubPayments) { unsubPayments(); unsubPayments = null; }
  if (unsubRent) { unsubRent(); unsubRent = null; }

  if (!user) {
    myMember = null; allMembers = []; allExpenses = []; allInvites = []; allSettlements = []; allPayments = []; allRent = [];
    renderAuthScreen();
    return;
  }

  unsubInvites = onSnapshot(query(invitesCol),
    (snap) => { allInvites = snap.docs.map(d => ({id:d.id, ...d.data()})); render(); },
    (err) => { toast('Invites read error: ' + err.message, 'error'); }
  );

  // live listen to members
  unsubMembers = onSnapshot(query(membersCol), async (snap) => {
    allMembers = snap.docs.map(d => ({id:d.id, ...d.data()}));
    myMember = allMembers.find(m => m.uid === currentUser.uid) || null;

    // auto-heal: if this signed-in user has no member doc yet (race condition,
    // or rules weren't published yet during their original signup), fix it now.
    if (!myMember) {
      try{
        const invSnap = await getDoc(doc(db,'invites', currentUser.email));
        if (invSnap.exists()) {
          const inv = invSnap.data();
          await setDoc(doc(db,'members', currentUser.uid), {
            name: inv.name || currentUser.displayName || currentUser.email.split('@')[0],
            email: currentUser.email, role:'member', status:'active',
            uid: currentUser.uid, createdAt: serverTimestamp()
          });
          await deleteDoc(doc(db,'invites', currentUser.email));
          return; // snapshot will refire
        }
        const displayName = currentUser.displayName || currentUser.email.split('@')[0];
        if (allMembers.length === 0) {
          // no members exist at all yet -> this user becomes the first admin
          await setDoc(doc(db,'members', currentUser.uid), {
            name: displayName, email: currentUser.email, role:'admin', status:'active',
            uid: currentUser.uid, createdAt: serverTimestamp()
          });
          return;
        }
        const alreadyHasDocById = allMembers.find(m => m.id === currentUser.uid);
        if (!alreadyHasDocById) {
          // members exist but none match this user -> create a pending request
          await setDoc(doc(db,'members', currentUser.uid), {
            name: displayName, email: currentUser.email, role:'member', status:'pending',
            uid: currentUser.uid, createdAt: serverTimestamp()
          });
          return;
        }
      }catch(e){
        toast('Profile setup error: ' + (e.message || 'profile set up nahi ho paya'), 'error');
      }
    }

    // only an ACTIVE member is allowed (by the Firestore rules) to read expenses.
    // Start the listener once they become active; stop it if they ever aren't.
    const isActiveNow = myMember && myMember.status === 'active';
    if (isActiveNow && !unsubExpenses) {
      unsubExpenses = onSnapshot(query(expensesCol, orderBy('createdAt','desc')),
        (esnap) => { allExpenses = esnap.docs.map(d => ({id:d.id, ...d.data()})); render(); },
        (err) => { toast('Expenses read error: ' + err.message, 'error'); }
      );
    } else if (!isActiveNow && unsubExpenses) {
      unsubExpenses(); unsubExpenses = null; allExpenses = [];
    }

    if (isActiveNow && !unsubSettlements) {
      unsubSettlements = onSnapshot(query(settlementsCol, orderBy('settledUpTo','desc')),
        (ssnap) => { allSettlements = ssnap.docs.map(d => ({id:d.id, ...d.data()})); render(); },
        (err) => { toast('Settlements read error: ' + err.message, 'error'); }
      );
    } else if (!isActiveNow && unsubSettlements) {
      unsubSettlements(); unsubSettlements = null; allSettlements = [];
    }

    if (isActiveNow && !unsubPayments) {
      unsubPayments = onSnapshot(query(paymentsCol, orderBy('createdAt','desc')),
        (psnap) => { allPayments = psnap.docs.map(d => ({id:d.id, ...d.data()})); render(); },
        (err) => { toast('Payments read error: ' + err.message, 'error'); }
      );
    } else if (!isActiveNow && unsubPayments) {
      unsubPayments(); unsubPayments = null; allPayments = [];
    }

    if (isActiveNow && !unsubRent) {
      unsubRent = onSnapshot(query(rentCol, orderBy('createdAt','desc')),
        (rsnap) => { allRent = rsnap.docs.map(d => ({id:d.id, ...d.data()})); render(); },
        (err) => { toast('Rent read error: ' + err.message, 'error'); }
      );
    } else if (!isActiveNow && unsubRent) {
      unsubRent(); unsubRent = null; allRent = [];
    }

    render();
  }, (err) => {
    toast('Members read error: ' + err.message, 'error');
  });
});

/* ---------------- SIGNUP / LOGIN LOGIC ---------------- */
async function handleSignup(name, email, password){
  const cred = await createUserWithEmailAndPassword(auth, email, password);
  await updateProfile(cred.user, {displayName: name});

  // check for an invite matching this email
  const invSnap = await getDoc(doc(db,'invites', email));
  if (invSnap.exists()) {
    await setDoc(doc(db,'members', cred.user.uid), {
      name, email, role:'member', status:'active', uid: cred.user.uid, createdAt: serverTimestamp()
    });
    await deleteDoc(doc(db,'invites', email));
    return;
  }

  // if no members exist yet at all, first user becomes admin automatically
  const allSnap = await getDocs(query(membersCol));
  if (allSnap.empty) {
    await setDoc(doc(db,'members', cred.user.uid), {
      name, email, role:'admin', status:'active', uid: cred.user.uid, createdAt: serverTimestamp()
    });
    return;
  }

  // otherwise, create a pending request awaiting admin approval
  await setDoc(doc(db,'members', cred.user.uid), {
    name, email, role:'member', status:'pending', uid: cred.user.uid, createdAt: serverTimestamp()
  });
}

function formatDateTime(ts){

}
function formatDateOnly(ts){
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);

}
function dateLabel(ts){
  if (!ts || !ts.toDate) return 'Date pending…';
  const d = ts.toDate();
  const now = new Date();
  const startOf = dt => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()).getTime();
  const diffDays = Math.round((startOf(now) - startOf(d)) / 86400000);
  if (diffDays === 0) return 'Aaj';
  if (diffDays === 1) return 'Kal';
  return d.toLocaleDateString('en-IN', {weekday:'short', day:'2-digit', month:'short', year:'numeric'});

function tsToMillis(ts){
  if (!ts) return 0;
  if (ts.toMillis) return ts.toMillis();
  return new Date(ts).getTime();
}
// Returns {fromMs, toMs} covering a whole calendar month, monthsAgo=0 is the current month.
function monthRange(monthsAgo){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() - monthsAgo;
  const start = new Date(y, m, 1, 0,0,0,0);
  const end = new Date(y, m+1, 1, 0,0,0,0);
  return { fromMs: start.getTime() - 1, toMs: end.getTime() - 1 };
}
function monthLabel(monthsAgo){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth() - monthsAgo, 1);
  return d.toLocaleDateString('en-IN', {month:'short', year:'numeric'});
}
function groupByDescription(expenses){
  const map = {};
  expenses.forEach(exp => {
    const label = (exp.description || 'Other').trim() || 'Other';
    const key = label.toLowerCase();
    if (!map[key]) map[key] = { label, total:0, count:0 };
    map[key].total += exp.amount;
    map[key].count += 1;
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

/* ---------------- BALANCE ENGINE ---------------- */
// Computes net balances + minimal settle-up transactions using only expenses
// (and manual payments) with createdAt in (fromMs, toMs]. Also returns the
// total spent, per-member paid totals, and the matching filtered expense list
// (already date-desc sorted). A "payment" is cash a member has personally
// handed over towards their own due — it reduces their debt directly.
function computeBalancesInRange(fromMs, toMs){
  const activeMembers = allMembers.filter(m=>m.status==='active');
  const net = {}, paidByMember = {};
  activeMembers.forEach(m => { net[m.uid] = 0; paidByMember[m.uid] = 0; });

  const filteredExpenses = [];
  let total = 0;

  allExpenses.forEach(exp => {
    // an expense whose serverTimestamp hasn't resolved locally yet is treated as "now"
    const createdMs = exp.createdAt ? tsToMillis(exp.createdAt) : Date.now();
    if (createdMs <= fromMs || createdMs > toMs) return;
    filteredExpenses.push(exp);

    const n = exp.splitAmong?.length || 0;
    if (!n) return;
    total += exp.amount;
    if (paidByMember[exp.paidBy] !== undefined) paidByMember[exp.paidBy] += exp.amount;
    const share = exp.amount / n;
    if (net[exp.paidBy] !== undefined) net[exp.paidBy] += exp.amount;
    exp.splitAmong.forEach(uid => {
      if (net[uid] !== undefined) net[uid] -= share;
    });
  });

  const filteredPayments = [];
  allPayments.forEach(p => {
    const createdMs = p.createdAt ? tsToMillis(p.createdAt) : Date.now();
    if (createdMs <= fromMs || createdMs > toMs) return;
    filteredPayments.push(p);
    if (net[p.uid] !== undefined) net[p.uid] += p.amount;          // payer's debt reduces
    if (p.toUid && net[p.toUid] !== undefined) net[p.toUid] -= p.amount; // receiver's credit reduces
  });

  return {net, txns: minimalTxns(net), total, paidByMember, filteredExpenses, filteredPayments};
}

function minimalTxns(net){
  const debtors = [], creditors = [];
  Object.entries(net).forEach(([uid, val]) => {
    if (val < -0.5) debtors.push({uid, amt:-val});
    else if (val > 0.5) creditors.push({uid, amt:val});
  });
  debtors.sort((a,b)=>b.amt-a.amt);
  creditors.sort((a,b)=>b.amt-a.amt);

  const txns = [];
  let i=0, j=0;
  while (i<debtors.length && j<creditors.length){
    const d = debtors[i], c = creditors[j];
    const amt = Math.min(d.amt, c.amt);
    txns.push({from:d.uid, to:c.uid, amt});
    d.amt -= amt; c.amt -= amt;
    if (d.amt < 0.5) i++;
    if (c.amt < 0.5) j++;
  }
  return txns;
}

// Current live balances: only expenses AFTER the last settlement count.
function computeBalances(){
  const lastSettlement = allSettlements[0] || null;
  const sinceMs = lastSettlement ? tsToMillis(lastSettlement.settledUpTo) : 0;
  return computeBalancesInRange(sinceMs, Number.MAX_SAFE_INTEGER);
}

  if (c.includes('requires-recent-login')) return 'Suraksha ke liye dobara login karke try karein.';
  return e.message || 'Kuch galat ho gaya, dobara try karein.';
}

      <div class="net-grid">
        ${activeMembers.map(m => {
          const v = net[m.uid] || 0;
          const cls = v>0.5?'pos': v<-0.5?'neg':'zero';
          const label = v>0.5? 'lena hai' : v<-0.5 ? 'dena hai' : 'settled';
          return `<div class="net-card"><div class="name">${escapeHtml(m.name)}</div><div class="val ${cls}">${money(v)}</div><div class="name" style="opacity:.6;font-size:11px;">${label}</div></div>`;
        }).join('')}
      </div>
      ${lastSettlement ? `<div style="font-size:11.5px;opacity:.75;margin-top:14px;position:relative;">ℹ️ Ye hisaab <b>${formatDateOnly(lastSettlement.settledUpTo)}</b> ke baad ke kharchon ka hai — usse pehle ka sab settle ho chuka hai. <a href="#/settle" style="color:var(--gold-light);">Settle page par poori history dekhein →</a></div>` : ''}
    </div>
    <div id="sec-board"></div>
  `;
  renderExpenseList(document.getElementById('sec-board'), activeMembers);
}

function renderExpenseListItems(expenses){
  if (!expenses.length){
    return `<div class="card empty"><span class="emoji">🧾</span>Is period mein koi kharcha nahi mila.</div>`;
  }
  let lastLabel = null;
  let rows = '';
  expenses.forEach(exp => {
    const label = dateLabel(exp.createdAt);
    if (label !== lastLabel){
      rows += `<div class="date-heading">${label}</div>`;
      lastLabel = label;
    }
    rows += `
      <div class="expense-item" data-open="${exp.id}" style="cursor:pointer;">
        <div class="expense-icon">🧾</div>
        <div class="expense-desc">
          <div class="title">${escapeHtml(exp.description)}</div>
          <div class="meta">Paid by <b>${escapeHtml(nameFor(exp.paidBy))}</b> · ${exp.splitAmong?.length||0} logon mein split · ${formatDateTime(exp.createdAt)}</div>
          <div class="chips">${(exp.splitAmong||[]).map(uid=>`<span class="chip">${escapeHtml(nameFor(uid))}</span>`).join('')}</div>
        </div>
        <div style="text-align:right;">
          <div class="expense-amt">${money(exp.amount)}</div>
        </div>
      </div>`;
  });
  return `<div class="card">${rows}</div>`;
}

function renderExpenseList(host, activeMembers){
  if (!allExpenses.length){
    host.innerHTML = `<div class="card empty"><span class="emoji">🧾</span>Abhi tak koi kharcha add nahi hua.<br>"+ Naya Kharcha" se shuru karein.</div>`;
    return;
  }
  host.innerHTML = renderExpenseListItems(allExpenses);
  host.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=> goTo('#/expense/' + el.dataset.open);
  });
}

function renderSettlementHistory(){
  if (!allSettlements.length){
    return `<div class="empty" style="padding:26px 10px;"><span class="emoji">🤝</span>Abhi tak koi settlement nahi hua.</div>`;
  }
  return allSettlements.map(s => `
    <div style="border-bottom:1px solid var(--paper-line);padding:14px 4px;">
      <div style="font-weight:600;font-size:14px;margin-bottom:4px;">${formatDateOnly(s.settledUpTo)} tak settle kiya gaya</div>

      <div class="chips">
        ${(s.txns && s.txns.length) ? s.txns.map(t=>`<span class="chip">${escapeHtml(nameFor(t.from))} → ${escapeHtml(nameFor(t.to))} · ${money(t.amt)}</span>`).join('')

function renderReports(host, activeMembers, isAdmin){
  const today = new Date();
  const todayStr = toDateInputValue(today);
  const oldestExp = allExpenses.length ? allExpenses[allExpenses.length-1] : null;
  const oldestStr = (oldestExp && oldestExp.createdAt) ? toDateInputValue(tsToMillis(oldestExp.createdAt) ? new Date(tsToMillis(oldestExp.createdAt)) : today) : todayStr;

  host.innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:14px;">Date se filter karein</h3>
      <div class="row">
        <div class="field"><label>From</label><input type="date" id="repFrom" value="${oldestStr}" max="${todayStr}"/></div>
        <div class="field"><label>To</label><input type="date" id="repTo" value="${todayStr}" max="${todayStr}"/></div>
      </div>
      <button class="btn-primary" id="repGoBtn">Dikhao</button>
      <div id="repResult" style="margin-top:18px;"></div>
    </div>
  `;

  function runFilter(){
    const fromVal = document.getElementById('repFrom').value;
    const toVal = document.getElementById('repTo').value;
    if (!fromVal || !toVal){ toast('Dono dates chunein'); return; }
    const fromMs = new Date(fromVal + 'T00:00:00').getTime() - 1; // inclusive of "from" day
    const toMs = new Date(toVal + 'T23:59:59.999').getTime();
    if (fromMs >= toMs){ toast('From date, To date se pehle honi chahiye'); return; }
    const {total, paidByMember, filteredExpenses} = computeBalancesInRange(fromMs, toMs);
    const resHost = document.getElementById('repResult');
    resHost.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;flex-wrap:wrap;gap:8px;border-top:1px solid var(--paper-line);padding-top:16px;">
        <div style="font-size:13px;color:var(--ink-soft);">Total kharcha (${filteredExpenses.length} entries)</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:22px;">${money(total)}</div>
      </div>
      <div class="net-grid" style="margin-bottom:16px;">
        ${activeMembers.map(m=>`<div class="net-card" style="background:var(--paper);border-color:var(--border);">
          <div class="name" style="color:var(--ink-soft);">${escapeHtml(m.name)}</div>
          <div class="val" style="color:var(--ink);">${money(paidByMember[m.uid]||0)}</div>
          <div class="name" style="opacity:.6;font-size:11px;color:var(--ink-soft);">paid</div>
        </div>`).join('')}
      </div>
      ${renderExpenseListItems(filteredExpenses)}
    `;
    resHost.querySelectorAll('[data-open]').forEach(el=>{
      el.onclick = ()=> goTo('#/expense/' + el.dataset.open);
    });
  }
  document.getElementById('repGoBtn').onclick = runFilter;
  runFilter();
}

function renderSettle(host, activeMembers, isAdmin){
  const today = new Date();
  const todayStr = toDateInputValue(today);
  const lastSettlement = allSettlements[0] || null;
  const lastSettleMs = lastSettlement ? tsToMillis(lastSettlement.settledUpTo) : 0;
  const {net: liveNet, txns: liveTxns} = computeBalances();
  const balHint = (uid)=>{
    const v = liveNet[uid]||0;
    return v < -0.5 ? ` (abhi ${money(-v)} dena hai)` : v > 0.5 ? ` (abhi ${money(v)} lena hai)` : ' (settled)';
  };

  host.innerHTML = `
    ${isAdmin ? `
    <div class="card" style="margin-bottom:20px;">
      <h3 style="margin-bottom:14px;">Payment record karein</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;">Jab koi member kisi doosre member ko cash/UPI se paise de, yahan record karein — dene wale ka "dena hai" aur lene wale ka "lena hai" dono turant utna kam ho jayega.</p>
      ${liveTxns.length ? `
      <div style="background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:16px;">
        <div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px;">Abhi ka baaki hisaab (tap karke form bhar jayega):</div>
        ${liveTxns.map((t,i)=>`
          <div style="display:flex;align-items:center;gap:10px;padding:6px 0;${i?'border-top:1px solid var(--paper-line);':''}">
            <div style="flex:1;font-size:13.5px;"><b>${escapeHtml(nameFor(t.from))}</b> → <b>${escapeHtml(nameFor(t.to))}</b></div>
            <div style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13.5px;">${money(t.amt)}</div>
            <button class="btn-ghost btn-small" data-prefill="${i}">Record</button>
          </div>`).join('')}
      </div>` : ''}
      <div class="row">
        <div class="field">
          <label>Kisne diya</label>
          <select id="payUid">
            ${activeMembers.map(m=>`<option value="${m.uid}">${escapeHtml(m.name)}${balHint(m.uid)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Kisko diya</label>
          <select id="payToUid">
            ${activeMembers.map((m,i)=>`<option value="${m.uid}" ${i===1?'selected':''}>${escapeHtml(m.name)}${balHint(m.uid)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field"><label>Amount</label><input id="payAmt" type="number" min="0" step="0.01" placeholder="0.00"/></div>
        <div class="field"><label>Note (optional)</label><input id="payNote" placeholder="e.g. Cash diya, UPI se bheja"/></div>
      </div>
      <button class="btn-primary" id="payAddBtn">Payment Add Karein</button>
    </div>` : ''}

    <div class="card" style="margin-bottom:20px;">
      <h3 style="margin-bottom:6px;">Payment History</h3>
      <div id="paymentHistoryHost">${renderPaymentHistory(isAdmin)}</div>
    </div>

    ${isAdmin ? `
    <div class="card" style="margin-bottom:20px;">
      <h3 style="margin-bottom:8px;">Poora hisaab settle karein</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;line-height:1.55;">
        Jab sab members aapas mein poora hisaab clear kar lein, to yahan se ek date tak ke saare kharche/payments "settle" mark kar dein.
        Uske baad Home page ka hisaab sirf us date ke <b>baad</b> ka banega — purana hisaab history mein records rahega.
        ${lastSettlement ? `<br><br>📌 Pichhli baar <b>${formatDateOnly(lastSettlement.settledUpTo)}</b> tak settle hua tha.` : '<br><br>Abhi tak koi settlement nahi hua hai.'}
      </p>
      <div class="field" style="max-width:220px;"><label>Is date tak settle karein</label><input type="date" id="settleDate" value="${todayStr}" max="${todayStr}"/></div>
      <button class="btn-danger" id="settlePreviewBtn">Settle Preview Dekhein</button>
      <div id="settlePreview" style="margin-top:16px;"></div>
    </div>` : ''}

    <div class="card">
      <h3 style="margin-bottom:6px;">Settlement History</h3>
      <div id="settleHistory">${renderSettlementHistory()}</div>
    </div>
  `;

  function wirePaymentDeleteButtons(){
    document.querySelectorAll('[data-del-payment]').forEach(btn=>{
      btn.onclick = ()=> deletePayment(btn.dataset.delPayment);
    });
  }
  wirePaymentDeleteButtons();

  if (isAdmin){
    document.getElementById('payAddBtn').onclick = async ()=>{
      const uid = document.getElementById('payUid').value;
      const toUid = document.getElementById('payToUid').value;
      const amt = parseFloat(document.getElementById('payAmt').value);
      const note = document.getElementById('payNote').value;
      const ok = await createPayment(uid, toUid, amt, note);
      if (ok){ goTo('#/settle'); }
    };
    document.querySelectorAll('[data-prefill]').forEach(btn=>{
      btn.onclick = ()=>{
        const t = liveTxns[Number(btn.dataset.prefill)];
        document.getElementById('payUid').value = t.from;
        document.getElementById('payToUid').value = t.to;
        document.getElementById('payAmt').value = Math.round(t.amt*100)/100;
        document.getElementById('payAmt').focus();
      };
    });

    document.getElementById('settlePreviewBtn').onclick = ()=>{
      const dateVal = document.getElementById('settleDate').value;
      if (!dateVal){ toast('Date chunein'); return; }
      const toMs = new Date(dateVal + 'T23:59:59.999').getTime();
      if (toMs <= lastSettleMs){ toast('Ye date pichhle settlement se pehle ya usi din ki hai'); return; }
      const {net, txns} = computeBalancesInRange(lastSettleMs, toMs);
      const previewHost = document.getElementById('settlePreview');
      previewHost.innerHTML = `
        <div style="background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;">
          ${txns.length ? txns.map(t=>`<div style="font-size:14px;padding:6px 0;border-bottom:1px solid var(--paper-line);">${escapeHtml(nameFor(t.from))} → ${escapeHtml(nameFor(t.to))}: <b>${money(t.amt)}</b></div>`).join('')
            : `<div style="font-size:13px;color:var(--ink-soft);">Is period mein koi naya hisaab nahi bacha (sab pehle se settled).</div>`}
        </div>
        <button class="btn-primary" id="settleConfirmBtn">Ye Confirm Karein aur Settle Karein</button>
      `;
      document.getElementById('settleConfirmBtn').onclick = async ()=>{
        if (!confirm('Pakka? Ye action undo nahi ho sakta — is date tak ka poora hisaab "settled" mark ho jayega.')) return;
        const ok = await createSettlement(toMs, net, txns);
        if (ok){ previewHost.innerHTML = ''; }
      };
    };
  }
}


/* ---------------- CHARTS PAGE ---------------- */
const CHART_COLORS = ['#B8892B','#2F6E4F','#B23A48','#3E6EA5','#8A5DB8','#C17A3E','#4A9B8E','#B85A8A','#6B8E4E','#A5763E'];

function destroyCharts(){
  activeCharts.forEach(c => { try{ c.destroy(); }catch(e){} });
  activeCharts = [];
}

function renderCharts(host, activeMembers){
  destroyCharts();

  if (typeof Chart === 'undefined'){
    host.innerHTML = `
      <div class="card empty" style="padding:40px 20px;">
        <span class="emoji">📉</span>
        Charts library load nahi ho payi.<br>
        <span style="font-size:12px;color:var(--ink-soft);">Internet connection check karein aur page reload karein (Chart.js ek CDN se load hoti hai).</span>
      </div>`;
    return;
  }

  const periods = [
    {key:'thisMonth', label:'Is Mahine', range: monthRange(0)},
    {key:'lastMonth', label:'Pichle Mahine', range: monthRange(1)},
    {key:'allTime', label:'Sab Time', range: {fromMs:-1, toMs:Number.MAX_SAFE_INTEGER}},
  ];
  let selectedPeriod = 'thisMonth';

  // month-over-month comparison (always this-month-so-far vs last full month)
  const thisM = monthRange(0), lastM = monthRange(1);
  const thisTotal = computeBalancesInRange(thisM.fromMs, thisM.toMs).total;
  const lastTotal = computeBalancesInRange(lastM.fromMs, lastM.toMs).total;
  const delta = thisTotal - lastTotal;
  const pct = lastTotal > 0 ? (delta / lastTotal * 100) : (thisTotal > 0 ? 100 : 0);
  const up = delta > 0.5, down = delta < -0.5;
  const trendColor = up ? 'var(--debt)' : down ? 'var(--credit)' : 'var(--ink-soft)';
  const trendIcon = up ? '▲' : down ? '▼' : '—';
  const trendText = up ? 'zyada' : down ? 'kam' : 'barabar';

  // last 6 months trend
  const monthsBack = 5;
  const monthlyTotals = [];
  for (let i = monthsBack; i >= 0; i--){
    const r = monthRange(i);
    monthlyTotals.push({ label: monthLabel(i), total: computeBalancesInRange(r.fromMs, r.toMs).total });
  }

  host.innerHTML = `
    <div class="card" style="margin-bottom:20px;">
      <h3 style="margin-bottom:14px;">Pichle mahine se comparison</h3>
      <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;">
        <div>
          <div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;">Is mahine (abhi tak)</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:24px;">${money(thisTotal)}</div>
        </div>
        <div style="font-size:20px;color:var(--border);">vs</div>
        <div>
          <div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;">Pichla mahina (poora)</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:24px;">${money(lastTotal)}</div>
        </div>
        <div style="margin-left:auto;text-align:right;">
          <div style="font-size:13px;font-weight:700;color:${trendColor};">${trendIcon} ${Math.abs(pct).toFixed(0)}% ${trendText}</div>
          <div style="font-size:11px;color:var(--ink-soft);">pichle mahine ke mukable</div>
        </div>
      </div>
      <div style="margin-top:18px;height:220px;"><canvas id="monthTrendChart"></canvas></div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
        <h3>Kisne kitna kharch kiya</h3>
        <select id="periodSelect" style="width:auto;min-width:150px;">
          ${periods.map(p=>`<option value="${p.key}" ${p.key===selectedPeriod?'selected':''}>${p.label}</option>`).join('')}
        </select>
      </div>
      <div style="display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:20px;align-items:center;" id="memberChartWrap">
        <div style="height:240px;"><canvas id="memberChart"></canvas></div>
        <div id="memberLegend"></div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:14px;">Kis saman/cheez par sabse zyada kharcha hua</h3>
      <div style="height:320px;"><canvas id="itemChart"></canvas></div>
      <p id="itemChartNote" style="font-size:12px;color:var(--ink-soft);margin-top:10px;"></p>
    </div>
  `;

  try {

  // --- month trend bar chart ---
  const trendCtx = document.getElementById('monthTrendChart');
  activeCharts.push(new Chart(trendCtx, {
    type: 'bar',
    data: {
      labels: monthlyTotals.map(m=>m.label),
      datasets: [{
        data: monthlyTotals.map(m=>m.total),
        backgroundColor: monthlyTotals.map((m,i)=> i===monthlyTotals.length-1 ? '#B8892B' : 'rgba(184,137,43,0.35)'),
        borderRadius: 6,
        maxBarThickness: 46
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display:false }, tooltip: { callbacks: { label: (ctx)=> money(ctx.parsed.y) } } },
      scales: { y: { beginAtZero:true, ticks:{ callback:(v)=>'₹'+v } }, x: { grid:{display:false} } }
    }
  }));

  // --- member pie/doughnut chart, redraws on period change ---
  function drawMemberChart(periodKey){
    const period = periods.find(p=>p.key===periodKey);
    const { paidByMember, total } = computeBalancesInRange(period.range.fromMs, period.range.toMs);
    const entries = activeMembers
      .map(m => ({ name: m.name, uid: m.uid, val: paidByMember[m.uid] || 0 }))
      .filter(e => e.val > 0)
      .sort((a,b)=> b.val - a.val);

    const memberChartWrap = document.getElementById('memberChartWrap');
    const legendHost = document.getElementById('memberLegend');
    if (activeCharts[1]) { try{ activeCharts[1].destroy(); }catch(e){} activeCharts[1]=null; }

    if (!entries.length){
      memberChartWrap.innerHTML = `<div class="empty" style="grid-column:1/-1;padding:30px 10px;"><span class="emoji">📊</span>Is period mein koi kharcha nahi mila.</div>`;
      return;
    }
    // rebuild canvas since innerHTML may have been replaced by the empty-state above on a prior draw
    if (!document.getElementById('memberChart')){
      memberChartWrap.innerHTML = `<div style="height:240px;"><canvas id="memberChart"></canvas></div><div id="memberLegend"></div>`;
    }
    const ctx = document.getElementById('memberChart');
    activeCharts[1] = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: entries.map(e=>e.name),
        datasets: [{ data: entries.map(e=>e.val), backgroundColor: entries.map((_,i)=>CHART_COLORS[i%CHART_COLORS.length]), borderWidth:2, borderColor:'#FFFDF7' }]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins: { legend: { display:false }, tooltip: { callbacks: { label:(ctx)=> `${ctx.label}: ${money(ctx.parsed)}` } } }
      }
    });
    document.getElementById('memberLegend').innerHTML = entries.map((e,i)=>`
      <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--paper-line);">
        <span style="width:11px;height:11px;border-radius:3px;background:${CHART_COLORS[i%CHART_COLORS.length]};flex-shrink:0;"></span>
        <span style="flex:1;font-size:14px;">${escapeHtml(e.name)}</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;">${money(e.val)}</span>
        <span style="font-size:12px;color:var(--ink-soft);min-width:38px;text-align:right;">${total>0 ? Math.round(e.val/total*100) : 0}%</span>
      </div>`).join('');
  }
  activeCharts.push(null); // reserve index 1 for member chart
  drawMemberChart(selectedPeriod);
  document.getElementById('periodSelect').onchange = (e) => {
    selectedPeriod = e.target.value;
    drawMemberChart(selectedPeriod);
    drawItemChart(selectedPeriod);
  };

  // --- item/description spend chart, uses same period selector ---
  function drawItemChart(periodKey){
    const period = periods.find(p=>p.key===periodKey);
    const { filteredExpenses } = computeBalancesInRange(period.range.fromMs, period.range.toMs);
    const grouped = groupByDescription(filteredExpenses);
    const top = grouped.slice(0, 10);
    const note = document.getElementById('itemChartNote');

    if (activeCharts[2]) { try{ activeCharts[2].destroy(); }catch(e){} activeCharts[2]=null; }

    if (!top.length){
      document.getElementById('itemChart').style.display='none';
      note.textContent = 'Is period mein koi kharcha nahi mila.';
      return;
    }
    document.getElementById('itemChart').style.display='';
    note.textContent = grouped.length > 10 ? `Top 10 dikhaye gaye hain (total ${grouped.length} alag items mein se).` : '';

    const ctx = document.getElementById('itemChart');
    activeCharts[2] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: top.map(t=>t.label),
        datasets: [{ data: top.map(t=>t.total), backgroundColor: top.map((_,i)=>CHART_COLORS[i%CHART_COLORS.length]), borderRadius:6 }]

function monthKeyLabel(key){
  const [y,m] = String(key).split('-').map(Number);
  if (!y || !m) return key || '—';
  return new Date(y, m-1, 1).toLocaleDateString('en-IN', {month:'long', year:'numeric'});
}

function renderRent(host, activeMembers, isAdmin){
  const curMonth = toDateInputValue(new Date()).slice(0,7);
  const months = Array.from(new Set([curMonth, ...allRent.map(r=>r.month).filter(Boolean)])).sort().reverse();
  let filter = curMonth;

  host.innerHTML = `
    <div class="card" style="margin-bottom:20px;">
      <h3 style="margin-bottom:6px;">Room rent payment record karein</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;">Jisne makan malik ko rent diya, yahan likh dein — kisne kitna diya, kis mahine ka, sab track hota rahega.</p>
      <div class="row">
        <div class="field">
          <label>Kisne diya</label>
          ${isAdmin
            ? `<select id="rentWho">${activeMembers.map(m=>`<option value="${m.uid}" ${m.uid===currentUser.uid?'selected':''}>${escapeHtml(m.name)}</option>`).join('')}</select>`
            : `<input value="${escapeHtml(myMember.name)}" disabled style="opacity:.7;"/>`}
        </div>
        <div class="field"><label>Amount</label><input id="rentAmt" type="number" min="0" step="0.01" placeholder="0.00"/></div>
      </div>
      <div class="row">

        <div class="field"><label>Note (optional)</label><input id="rentNote" placeholder="e.g. UPI se bheja, cash diya"/></div>
      </div>
      <button class="btn-primary" id="rentAddBtn">Rent Add Karein</button>
    </div>

      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
        <h3>Rent ka hisaab</h3>
        <select id="rentFilter" style="width:auto;min-width:170px;">
          <option value="all">Sab Mahine</option>
          ${months.map(m=>`<option value="${m}" ${m===filter?'selected':''}>${monthKeyLabel(m)}</option>`).join('')}
        </select>
      </div>
      <div id="rentSummary"></div>
    </div>
  `;

  function drawSummary(){
    const entries = allRent.filter(r => filter==='all' || r.month === filter);
    const total = entries.reduce((a,r)=>a + (r.amount||0), 0);
    const perMember = {};
    entries.forEach(r => { perMember[r.paidBy] = (perMember[r.paidBy]||0) + (r.amount||0); });
    const rows = Object.entries(perMember).sort((a,b)=>b[1]-a[1]);

    let lastMonth = null, list = '';
    entries.forEach(r => {
      if (filter==='all' && r.month !== lastMonth){
        list += `<div class="date-heading">${monthKeyLabel(r.month)}</div>`;
        lastMonth = r.month;
      }
      list += `
        <div style="display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--paper-line);padding:11px 4px;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;font-weight:600;">${escapeHtml(nameFor(r.paidBy))} <span style="font-weight:400;color:var(--ink-soft);">ne makan malik ko diya</span></div>
            <div style="font-size:11.5px;color:var(--ink-soft);">${monthKeyLabel(r.month)} ka rent · ${formatDateTime(r.createdAt)}${r.note ? ' · ' + escapeHtml(r.note) : ''}</div>
          </div>
          <div style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;">${money(r.amount)}</div>
          ${isAdmin ? `<button class="btn-ghost btn-small" data-del-rent="${r.id}">✕</button>` : ''}
        </div>`;
    });

    document.getElementById('rentSummary').innerHTML = entries.length ? `
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
        <div style="font-size:13px;color:var(--ink-soft);">Makan malik ko total diya (${entries.length} entries)</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:22px;">${money(total)}</div>
      </div>
      <div class="net-grid" style="margin-bottom:16px;">
        ${rows.map(([uid,amt])=>`<div class="net-card" style="background:var(--paper);border-color:var(--border);">
          <div class="name" style="color:var(--ink-soft);">${escapeHtml(nameFor(uid))}</div>

    if (newPass !== newPass2){ errEl.textContent = 'Dono naye password match nahi kar rahe'; return; }
    try{
      const cred = EmailAuthProvider.credential(currentUser.email, curPass);
      await reauthenticateWithCredential(currentUser, cred);
      await updatePassword(currentUser, newPass);
      msgEl.textContent = 'Password update ho gaya ✓';
      document.getElementById('curPass').value = '';
      document.getElementById('newPass').value = '';
      document.getElementById('newPass2').value = '';

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

<!--
============================================================
 SETUP INSTRUCTIONS
============================================================
1. Firebase project banayein: https://console.firebase.google.com
2. Project settings > General > "Your apps" > Web app (</>) add karein,
   aur wahan se milne wala firebaseConfig object upar wale
   "APNA FIREBASE CONFIG YAHAN PASTE KAREIN" section mein paste karein.

3. Authentication enable karein:
   Build > Authentication > Sign-in method > "Email/Password" ON karein.
   (Optional) Build > Authentication > Templates > "Password reset" se us
   email ka look/sender-name customize kar sakte hain jo "Password bhool
   gaye?" click karne par user ko jaata hai — Firebase ki default email
   bhi bina kisi extra setup ke kaam karti hai.

4. Firestore Database banayein (production mode).

5. Firestore Rules (Build > Firestore Database > Rules) mein ye paste karein:

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function isSignedIn() { return request.auth != null; }
    function memberExists() {
      return exists(/databases/$(database)/documents/members/$(request.auth.uid));
    }
    function myMember() {
      return get(/databases/$(database)/documents/members/$(request.auth.uid)).data;
    }
    function isActiveMember() {
      return isSignedIn() && memberExists() && myMember().status == 'active';
    }
    function isAdmin() {
      return isSignedIn() && memberExists() && myMember().status == 'active' && myMember().role == 'admin';
    }

    match /members/{memberId} {
      allow read: if isSignedIn();
      // a user can only ever create their OWN member doc (signup / self-heal / claiming an invite)
      allow create: if isSignedIn() && memberId == request.auth.uid;
      allow update: if isAdmin();
      allow delete: if isAdmin();
    }

    match /invites/{inviteEmail} {
      allow read: if isSignedIn();
      allow create, update: if isAdmin();
      // an invited person can delete/consume their own invite once they sign up
      allow delete: if isAdmin() || (isSignedIn() && request.auth.token.email == inviteEmail);
    }

    match /expenses/{expenseId} {
      allow read: if isActiveMember();
      allow create: if isActiveMember() && request.resource.data.createdBy == request.auth.uid;
      // Admin can edit anytime. The person who added the expense can only
      // edit it within 10 minutes of creation; after that, only admin can.
      allow update: if isAdmin() || (
        isActiveMember() &&
        resource.data.createdBy == request.auth.uid &&
        request.time < resource.data.createdAt + duration.value(10, 'm')
      );
      allow delete: if isAdmin();
    }

    match /settlements/{settlementId} {
      allow read: if isActiveMember();
      allow create: if isAdmin();
      // settlements are an immutable audit trail — never editable or deletable
      allow update, delete: if false;
    }

    match /payments/{paymentId} {
      allow read: if isActiveMember();
      // only admin records/edits/removes a payment, to prevent members
      // falsely claiming they paid their dues
      allow create, update, delete: if isAdmin();
    }

    match /rentPayments/{rentId} {
      allow read: if isActiveMember();
      // a member can record their own rent payment; admin can record for anyone
      allow create: if isActiveMember()
        && request.resource.data.createdBy == request.auth.uid
        && (isAdmin() || request.resource.data.paidBy == request.auth.uid);
      allow update, delete: if isAdmin();
    }
  }
}

   Hosting, Netlify, Vercel — par upload kar dein).

KAISE KAAM KARTA HAI:
- App mein alag alag pages hain (URL hash se): Home (#/), + Naya Kharcha (#/add),
  Reports (#/reports, date-filter), Charts (#/charts, visual breakdown),
  Settle (#/settle, payments record karna + poora hisaab settle karna) — ye
  sab active members ko dikhte hain. Members (#/members, sirf admin ko
  dikhta hai), aur har kharche ka apna detail page (#/expense/ID) jahan se
  edit page (#/expense/ID/edit) khulta hai.
- Charts page 3 cheezein dikhata hai: (1) is mahine ka kharcha pichle mahine
  se compare + pichle 6 mahino ka trend, (2) kisne kitna kharch kiya (doughnut
  chart, "Is Mahine / Pichle Mahine / Sab Time" filter ke saath), (3) kaunse
  "saman"/description par sabse zyada kharcha hua (top 10 items ka bar chart).
  Ye page Chart.js library use karta hai (CDN se load hoti hai, isliye
  internet chahiye).
- Home page ke kharche latest-first, date-wise headings (Aaj / Kal / poori
  date) ke saath group hokar dikhte hain.
- Reports page se koi bhi member From–To date chunke us period ka total
  kharcha aur har member ne kitna paid kiya dekh sakta hai.
- Settle page par (sirf admin) ek member choose karke "kitna paisa diya"
  record kar sakte hain (cash/UPI se dues chukane par) — us member ka
  outstanding balance Home page ke dashboard se turant utna kam ho jata hai.
  Har payment ki history yahan dikhti hai (admin delete bhi kar sakta hai
  agar galti se galat entry ho gayi ho).
- Isi Settle page par ek "Poora hisaab settle karein" section bhi hai (sirf
  admin): ek date chunkar preview dekhte hain ki us date tak kisko kitna
  dena/lena hai, aur confirm karne par ek "settlement" record ban jata hai
  (immutable — kabhi edit/delete nahi hota, sirf history ke liye rehta hai).
  Iske baad Home page ka live hisaab sirf us settlement ke BAAD ke naye
  kharchon/payments se banta hai — purana hisaab dobara nahi dikhta, lekin
  Settle > Settlement History mein hamesha ke liye record rehta hai.
- Settle page par admin "Kisne diya" aur "Kisko diya" dono chunkar payment
  record karta hai — dene wale ka "dena hai" aur lene wale ka "lena hai"
  dono utna kam ho jata hai. Upar "Abhi ka baaki hisaab" list se ek tap par
  form pehle se bhar jata hai.
- Rent page (#/rent): jisne makan malik ko rent diya wo apni entry (amount,
  kis mahine ka, note) daalta hai; admin kisi ke naam se bhi daal sakta hai
  aur galat entry delete kar sakta hai. Mahine-wise total aur kisne kitna
  diya dikhta hai. Ye Home ke balance ko affect nahi karta.
- Login page par "Password bhool gaye?" link se koi bhi user apne email par
  Firebase ka password-reset link mangwa sakta hai (Firebase khud email
  bhejta hai, isliye koi extra email-service setup nahi chahiye).
- Login ke baad header mein "Account" button se koi bhi user apna password
  badal sakta hai (current password + naya password dobara daalkar).
- Sabse pehla signup karne wala user automatically ADMIN ban jata hai.
- Admin "Members" page se naye member ko email+naam se INVITE karta hai
  (ye page normal members ko bilkul nahi dikhta). Jab wo email us naam se
  signup karta hai, automatically room join ho jata hai.
- Agar koi invite ke bina hi signup kar le, wo "pending" mein chala jata hai
  aur admin ko approve/reject karna hota hai.
- Admin kisi bhi member ko admin bana sakta hai, naam update kar sakta hai,
  ya remove kar sakta hai (remove hote hi uski room access khatam ho jaati hai).
- Kharcha add karte waqt "description" (dropdown suggestions se chunein ya
  khud type karein), "amount", aur "kin logon mein split ho" select karein —
  amount un logon mein barabar (equal) split ho jata hai. "Kisne pay kiya"
  hamesha wahi hota hai jo kharcha add kar raha hai.
- Kisi bhi kharche par click karke uska pura detail dekh sakte hain:
  amount, kisne pay kiya, date/time, aur kin logon ke liye hua.
- "Kisne pay kiya" field sirf admin edit page se badal sakta hai (agar kisi
  aur ke naam se galti se add ho gaya ho). Normal member ye field edit nahi
  kar sakta, sirf apna description/amount/split pehle 10 minute tak edit
  kar sakta hai.
- EDIT RULE: jis member ne kharcha add kiya hai, wo usse sirf 10 minute tak
  edit kar sakta hai — uske baad usse edit ka button hi nahi dikhega.
  Admin kisi bhi kharche ko hamesha edit kar sakta hai. Delete sirf admin
  kar sakta hai. Ye rule client (app) aur server (Firestore rules) dono
  jagah enforce hota hai, isliye koi bypass nahi kar sakta.
- Sabse upar "Kis ne kise dena hai" board saare kharchon ko net karke
  minimum transactions mein settle-up dikhata hai.

NOTE: Ye pure client-side (browser + Firebase) app hai, isliye admin doosre
users ka Firebase Auth account seedha delete nahi kar sakta (uske liye Cloud
Function/Admin SDK backend chahiye hota). "Remove" karne se unki room access
turant khatam ho jaati hai (Firestore rules ke through) — jo practically
same cheez hai.
